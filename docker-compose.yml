version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: autonomous_qa_postgres
    restart: always
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: autonomous_qa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: autonomous_qa_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
